name: CI tests

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: "${{ github.workflow }} @ ${{ github.event.pull_request.head.label || github.head_ref || github.ref || github.run_id }}"
  cancel-in-progress: true

defaults:
  run:
    working-directory: .

jobs:
  test:
    runs-on: ${{ matrix.os }}
    env:
      # Skip puppeteer's chrome download in CI and point it at the
      # runner's pre-installed Chrome via channel: "chrome" in ci.test.ts.
      PUPPETEER_SKIP_DOWNLOAD: "true"
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node_version: [24]
        include:
          - os: ubuntu-latest
            node_version: 22
          - os: ubuntu-latest
            node_version: 25
          - os: ubuntu-latest
            node_version: 26
      fail-fast: false
    name: "CI tests on node-${{ matrix.node_version }}, ${{ matrix.os }}"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Set node version to ${{ matrix.node_version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node_version }}
          cache: "pnpm"
          check-latest: true

      - name: Install
        run: pnpm install

      - name: Build
        run: pnpm run build

      - name: Disable AppArmor on Ubuntu
        if: runner.os == 'Linux'
        run: echo 0 | sudo tee /proc/sys/kernel/apparmor_restrict_unprivileged_userns

      - name: Run CI tests
        run: pnpm run ci
